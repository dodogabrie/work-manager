services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workplanner}
      POSTGRES_DB: ${POSTGRES_DB:-workplanner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workplanner}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    build: ./backend
    # env_file e non `environment:`: Compose interpola le $ nei valori, e un
    # hash argon2 ne è pieno ($argon2id$v=19$m=...). Interpolandolo, la
    # password owner arriverebbe nel container corrotta e il login fallirebbe
    # senza dire perché.
    env_file: .env
    environment:
      OWNER_PASSWORD_HASH_FILE: /secrets/owner_password_hash
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-workplanner}:${POSTGRES_PASSWORD:-workplanner}@db:5432/${POSTGRES_DB:-workplanner}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./secrets:/secrets
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      BACKEND_ORIGIN: http://backend:8000
      VITE_API_BASE: ${VITE_API_BASE:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
