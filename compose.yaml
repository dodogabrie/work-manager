services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workplanner}
      POSTGRES_DB: ${POSTGRES_DB:-workplanner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workplanner}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-workplanner}:${POSTGRES_PASSWORD:-workplanner}@db:5432/${POSTGRES_DB:-workplanner}
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-change-me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      TZ: ${TZ:-Europe/Rome}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
